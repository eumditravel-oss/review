<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>배근자료 PDF 데이터 추출 시스템</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>배근자료 PDF 데이터 추출 시스템</h1>
      <p>PDF 페이지 전체를 Gemini API로 분석하여 카드 위치와 배근값을 추출합니다.</p>
    </div>
    <div class="top-actions">
      <button id="btnSaveProject" class="secondary">프로젝트 저장</button>
      <button id="btnLoadProject" class="secondary">저장 프로젝트 불러오기</button>
      <button id="btnClearAll" class="danger">초기화</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>1. 프로젝트</h2>
        <label>프로젝트명</label>
        <input id="projectName" type="text" placeholder="예: 용인 TEL 배근자료 검토" />
        <label>PDF 선택</label>
        <input id="pdfInput" type="file" accept="application/pdf" />
        <div id="pdfInfo" class="hint">PDF 미선택</div>
      </section>

      <section class="card">
        <h2>2. Gemini API</h2>
        <label>API Key</label>
        <input id="apiKey" type="password" placeholder="Gemini API Key 입력" />
        <div class="row">
          <button id="btnRememberKey" class="secondary">이 브라우저에 저장</button>
          <button id="btnForgetKey" class="secondary">삭제</button>
        </div>
        <label>모델</label>
        <select id="modelSelect">
          <option value="auto" selected>자동 선택</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          <option value="gemini-flash-latest">gemini-flash-latest</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        </select>
        <button id="btnCheckApi">API 상태 확인</button>
        <div id="apiStatus" class="hint">API 미확인</div>
      </section>

      <section class="card">
        <h2>3. 분석</h2>
        <label>분석 범위</label>
        <select id="rangeSelect">
          <option value="all">전체 페이지</option>
          <option value="current">현재 선택 페이지</option>
          <option value="custom">지정 페이지</option>
        </select>
        <input id="customPages" type="text" placeholder="예: 1,4,5-8" />
        <button id="btnAnalyze" class="primary">분석 실행</button>
        <button id="btnReAnalyzeSelected" class="secondary">선택 카드 재분석</button>
        <div id="progress" class="progress">대기 중</div>
      </section>

      <section class="card">
        <h2>4. 필터</h2>
        <label>파트</label>
        <select id="partFilter"><option value="">전체</option></select>
        <label>동명</label>
        <select id="dongFilter"><option value="">전체</option></select>
        <label>부호 검색</label>
        <input id="symbolFilter" type="text" placeholder="부호 입력" />
      </section>

      <section class="card">
        <h2>5. 내보내기</h2>
        <button id="btnExportJson">JSON 다운로드</button>
        <button id="btnExportCsv">CSV 다운로드</button>
        <button id="btnExportExcelCsv">Excel용 CSV 다운로드</button>
      </section>
    </aside>

    <section class="content">
      <section class="summary">
        <div><strong>공사명</strong><span id="summaryProject">-</span></div>
        <div><strong>페이지</strong><span id="summaryPages">-</span></div>
        <div><strong>카드</strong><span id="summaryCards">-</span></div>
        <div><strong>상태</strong><span id="summaryStatus">-</span></div>
      </section>

      <section class="result-panel">
        <h2>부호별 리스트</h2>
        <div class="table-wrap">
          <table id="resultTable">
            <thead>
              <tr>
                <th>상태</th>
                <th>파트</th>
                <th>동명</th>
                <th>Page</th>
                <th>Card</th>
                <th>명칭</th>
                <th>부호</th>
                <th>요약</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="detail-grid">
        <section class="result-panel">
          <h2>상세 데이터</h2>
          <div class="table-wrap detail-table-wrap">
            <table id="detailTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="result-panel">
          <h2>원본 페이지 / API Crop</h2>
          <div class="image-grid">
            <div>
              <div class="image-title">페이지 이미지</div>
              <canvas id="pageCanvas"></canvas>
            </div>
            <div>
              <div class="image-title">카드 Crop</div>
              <canvas id="cropCanvas"></canvas>
            </div>
          </div>
          <h2>API 원문</h2>
          <pre id="apiRaw"></pre>
        </section>
      </section>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76/pdf.min.mjs" type="module"></script>
  <script src="./pageTemplates.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
